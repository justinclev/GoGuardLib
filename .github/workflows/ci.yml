name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Nothing here writes to the repository, so the token gets read access only.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Test with race detector and coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | sed 's/%//')
          echo "Total coverage: $COVERAGE%"
          if [ "$(echo "$COVERAGE < 80.0" | bc -l)" -eq 1 ]; then
            echo "Coverage below 80%"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Build
        run: go build ./...

  # Known vulnerabilities in the dependencies and the standard library in use.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify module checksums
        run: go mod verify && (cd kafka && go mod verify)
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan the core module
        run: $(go env GOPATH)/bin/govulncheck ./...
      - name: Scan the Kafka module
        run: cd kafka && $(go env GOPATH)/bin/govulncheck ./...

  # The demo (backend and UI) is built on every push so it cannot rot.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Backend
        working-directory: demo/backend
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
          go vet ./...
          go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI
        working-directory: demo/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # The Kafka adapter is its own Go module (it needs cgo and confluent-kafka-go),
  # so the jobs above, which run at the repository root, do not touch it.
  kafka:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./... && go vet -tags integration ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...
      - name: Test
        run: go test -race -count=1 ./...

  # Runs the consumer against a real single-node Kafka (KRaft) broker.
  kafka-integration:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
    defaults:
      run:
        working-directory: kafka
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Wait for the broker
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo "broker did not start"; exit 1
      - name: Integration tests
        env:
          KAFKA_BROKERS: localhost:9092
        run: go test -tags integration -count=1 -timeout 15m ./confluent/

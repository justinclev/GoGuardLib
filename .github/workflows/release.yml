name: Release

# Pushing a tag such as v0.5.0 runs the full checks and publishes a GitHub release
# whose notes are the tag's section of CHANGELOG.md. Go modules are consumed
# straight from the tag; the kafka module needs its own tag (kafka/v0.5.0).
on:
  push:
    tags: ["v*", "kafka/v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify
        run: |
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

<header class="bar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3ee6ff" />
          <stop offset="1" stop-color="#8f86ff" />
        </linearGradient>
      </defs>
      <path d="M16 2l11 4v9c0 7-4.6 12.2-11 15C9.6 27.200 5 22 5 15V6l11-4z" fill="none" stroke="url(#lg)" stroke-width="2.2" />
      <path d="M10.500 16.500l4 4 7-8" fill="none" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div>
      <h1>GoGuardLib <span>live</span></h1>
      <p>Circuit breakers, a durable dead-letter log and automatic recovery, watched in real time</p>
    </div>
  </div>

  <div class="pills">
    @if (store.snapshot(); as s) {
      <span class="pill">
        <i class="dot" [class.live]="true"></i>
        {{ s.backend === 'kafka' ? 'Apache Kafka' : 'Simulated topic' }}
      </span>
    }
    <span class="pill" [class.bad]="!store.connected()">
      <i class="dot" [class.live]="store.connected()"></i>
      {{ store.connected() ? 'Live' : 'Reconnecting…' }}
    </span>
  </div>
</header>

server {
  listen 80;
  server_name _;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS, so nginx starts even if the orchestrator is still coming up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The API, including the server-sent event stream: never buffer or time it out.
  location /api/ {
    set $orchestrator http://orchestrator:8080;
    proxy_pass $orchestrator;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding off;
  }

  # The page itself is never cached: a browser that kept an old index.html would keep
  # loading the old JavaScript it names, and show an old UI after the demo is rebuilt.
  # (add_header in a location replaces the server-level ones, so the security headers
  # are repeated.)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Script and style files carry a hash of their content in their name, so a new build
  # is a new URL and the old one can be cached for ever.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}

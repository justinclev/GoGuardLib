server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS, so nginx starts even if the orchestrator is still coming up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The API, including the server-sent event stream: never buffer or time it out.
  location /api/ {
    set $orchestrator http://orchestrator:8080;
    proxy_pass $orchestrator;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?)$ {
    expires 1h;
    add_header Cache-Control "public";
  }
}

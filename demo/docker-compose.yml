# GoGuardLib live demo.
#
#   docker compose up --build
#
# then open http://localhost:4280
#
# If a port is taken, choose others:  UI_PORT=5000 API_PORT=5001 docker compose up --build
name: goguard-demo

services:
  # A single-node Kafka (KRaft, no ZooKeeper).
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # The four downstream APIs an order passes through, plus a control API that
  # takes each one down, slows it, or makes it flaky.
  services:
    build:
      context: ..
      dockerfile: demo/backend/Dockerfile
      target: services
    restart: unless-stopped

  # Generates HTTP and Kafka traffic through GoGuardLib and streams what happens.
  orchestrator:
    build:
      context: ..
      dockerfile: demo/backend/Dockerfile
      target: orchestrator
    environment:
      SERVICES_HOST: services
      KAFKA_BROKERS: kafka:9092
      DLQ_DIR: /data/dlq
    volumes:
      - dlq-data:/data
    depends_on:
      kafka:
        condition: service_healthy
      services:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080" # the API, for curl and for poking around

  # The Angular UI, served by nginx, which forwards /api to the orchestrator.
  ui:
    build:
      context: ./ui
    depends_on:
      - orchestrator
    ports:
      - "${UI_PORT:-4280}:80"

volumes:
  dlq-data:
